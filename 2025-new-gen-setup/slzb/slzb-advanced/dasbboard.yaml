            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.atoll_preamp_vol_less_zs06
          - type: button
            name: Vol +
            icon: mdi:volume-plus
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.atoll_preamp_vol_plus_zs06
          - type: button
            name: Sel -
            icon: mdi:skip-previous
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.atoll_preamp_sel_less_zs06
          - type: button
